name: tracemind-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tracemind
      POSTGRES_PASSWORD: tracemind
      POSTGRES_DB: tracemind
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracemind"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - tracemind-pgdata:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./telemetry/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - ./data/otel-out:/var/otel/out
    ports:
      - "4317:4317"
      - "4318:4318"

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./telemetry/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./telemetry/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  api-gateway:
    build:
      context: .
      args:
        SERVICE_MODULE: services.api_gateway.app
    environment:
      SERVICE_NAME: api-gateway
      DB_BACKEND: simulated
      ORDER_SERVICE_URL: http://order-service:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8000:8000"
    depends_on:
      order-service:
        condition: service_started
      otel-collector:
        condition: service_started

  order-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services.order_service.app
    environment:
      SERVICE_NAME: order-service
      DB_BACKEND: simulated
      USER_SERVICE_URL: http://user-service:8000
      PAYMENT_SERVICE_URL: http://payment-service:8000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8001:8000"
    depends_on:
      user-service:
        condition: service_started
      payment-service:
        condition: service_started
      otel-collector:
        condition: service_started

  payment-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services.payment_service.app
    environment:
      SERVICE_NAME: payment-service
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://tracemind:tracemind@postgres:5432/tracemind
      DB_POOL_SIZE: "5"
      DB_POOL_TIMEOUT_SECONDS: "2.0"
      PAYMENT_FAULT_MODE: none
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

  user-service:
    build:
      context: .
      args:
        SERVICE_MODULE: services.user_service.app
    environment:
      SERVICE_NAME: user-service
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://tracemind:tracemind@postgres:5432/tracemind
      DB_POOL_SIZE: "5"
      DB_POOL_TIMEOUT_SECONDS: "2.0"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started

volumes:
  tracemind-pgdata:
