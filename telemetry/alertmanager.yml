# Minimal Alertmanager configuration for the TraceMind demo (improvement I10).
#
# Alerts are grouped here exactly as a real deployment would group them, so
# the alert-reduction measurement has a realistic input. The webhook
# receiver is where the ingestion service would receive raw alerts.
route:
  receiver: default
  group_by: ["alertname", "service"]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: default
    webhook_configs:
      - url: http://api-gateway:8000/alerts
        send_resolved: false
